name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions syntax
        shell: bash
        run: |
          version=1.7.12
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore NovaFleet.sln --nologo
      - name: Build
        run: dotnet build NovaFleet.sln --configuration Release --no-restore --nologo
      - name: Unit tests
        shell: pwsh
        run: |
          dotnet test tests/NovaFleet.UnitTests/NovaFleet.UnitTests.csproj --configuration Release --no-build --no-restore --nologo --logger 'trx;LogFileName=unit.trx' --results-directory TestResults/backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Assert-CiTestResults.ps1 -TrxPath TestResults/backend/unit.trx -MinimumTotal 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        working-directory: web
        run: npm ci
      - name: Tests
        working-directory: web
        run: npm test
      - name: Zero-warning lint
        working-directory: web
        run: npm run lint -- --deny-warnings
      - name: Production build
        working-directory: web
        run: npm run build

  installer-mock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer upgrade checks
        run: ./installer/Test-Upgrade.ps1

  installer-sql:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight LocalDB
        shell: pwsh
        run: |
          & sqllocaldb info MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'LocalDB MSSQLLocalDB is unavailable.' }
          & sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'LocalDB MSSQLLocalDB could not be started.' }
          & sqlcmd -S '(localdb)\MSSQLLocalDB' -E -C -b -Q 'SELECT 1'
          if ($LASTEXITCODE -ne 0) { throw 'LocalDB SQL preflight failed.' }
      - name: Guarded installer SQL recovery
        run: ./installer/Test-UpgradeSql.ps1

  localdb-sql:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Preflight LocalDB
        shell: pwsh
        run: |
          & sqllocaldb info MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'LocalDB MSSQLLocalDB is unavailable.' }
          & sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'LocalDB MSSQLLocalDB could not be started.' }
          & sqlcmd -S '(localdb)\MSSQLLocalDB' -E -C -b -Q 'SELECT 1'
          if ($LASTEXITCODE -ne 0) { throw 'LocalDB SQL preflight failed.' }
      - name: Build API and integration tests
        run: |
          dotnet restore NovaFleet.sln --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build NovaFleet.sln --configuration Release --no-restore --nologo
      - name: Migrate isolated LocalDB catalogs
        shell: pwsh
        env:
          NOVAFLEET_LOGIN_TEST_SQL: Server=(localdb)\MSSQLLocalDB;Integrated Security=true;TrustServerCertificate=true;Database=NovaFleet_Login_Test_20261124
          NOVAFLEET_SMS_TEST_SQL: Server=(localdb)\MSSQLLocalDB;Integrated Security=true;TrustServerCertificate=true;Database=NovaFleet_SmsQueue_Test_20261124
          NOVAFLEET_ALLOCATION_TEST_SQL: Server=(localdb)\MSSQLLocalDB;Integrated Security=true;TrustServerCertificate=true;Database=NovaFleet_Allocation_Test_20261125
          NOVAFLEET_MISSION_CHANGE_TEST_SQL: Server=(localdb)\MSSQLLocalDB;Integrated Security=true;TrustServerCertificate=true;Database=NovaFleet_MissionChangeSnapshot_Test_20261124
          NOVAFLEET_MIGRATION_TEST_SQL: Server=(localdb)\MSSQLLocalDB;Integrated Security=true;TrustServerCertificate=true;Database=NovaFleet_Migration_Test_0123456789abcdef0123456789abcdef
        run: |
          $api = 'src/NovaFleet.Api/bin/Release/net10.0/NovaFleet.Api.dll'
          ./scripts/Initialize-CiDatabase.ps1 -ConnectionString $env:NOVAFLEET_LOGIN_TEST_SQL -ApiDll $api
          ./scripts/Initialize-CiDatabase.ps1 -ConnectionString $env:NOVAFLEET_SMS_TEST_SQL -ApiDll $api
          ./scripts/Initialize-CiDatabase.ps1 -ConnectionString $env:NOVAFLEET_ALLOCATION_TEST_SQL -ApiDll $api
          ./scripts/Initialize-CiDatabase.ps1 -ConnectionString $env:NOVAFLEET_MISSION_CHANGE_TEST_SQL -ApiDll $api
          ./scripts/Initialize-CiDatabase.ps1 -ConnectionString $env:NOVAFLEET_MIGRATION_TEST_SQL -ApiDll $api
      - name: LocalDB integration and migration tests
        shell: pwsh
        env:
          NOVAFLEET_LOGIN_TEST_SQL: Server=(localdb)\MSSQLLocalDB;Integrated Security=true;TrustServerCertificate=true;Database=NovaFleet_Login_Test_20261124
          NOVAFLEET_SMS_TEST_SQL: Server=(localdb)\MSSQLLocalDB;Integrated Security=true;TrustServerCertificate=true;Database=NovaFleet_SmsQueue_Test_20261124
          NOVAFLEET_ALLOCATION_TEST_SQL: Server=(localdb)\MSSQLLocalDB;Integrated Security=true;TrustServerCertificate=true;Database=NovaFleet_Allocation_Test_20261125
          NOVAFLEET_MISSION_CHANGE_TEST_SQL: Server=(localdb)\MSSQLLocalDB;Integrated Security=true;TrustServerCertificate=true;Database=NovaFleet_MissionChangeSnapshot_Test_20261124
          NOVAFLEET_MIGRATION_TEST_SQL: Server=(localdb)\MSSQLLocalDB;Integrated Security=true;TrustServerCertificate=true;Database=NovaFleet_Migration_Test_0123456789abcdef0123456789abcdef
        run: |
          dotnet test tests/NovaFleet.IntegrationTests/NovaFleet.IntegrationTests.csproj --configuration Release --no-build --no-restore --nologo --filter 'FullyQualifiedName!~MaintenanceSqlServerTests' --logger 'trx;LogFileName=localdb.trx' --results-directory TestResults/sql
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Assert-CiTestResults.ps1 -TrxPath TestResults/sql/localdb.trx -MinimumTotal 1

  maintenance-sql:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native localhost SQL Server
        run: ./scripts/Setup-CiSqlServer.ps1
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build API and integration tests
        run: |
          dotnet restore NovaFleet.sln --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build NovaFleet.sln --configuration Release --no-restore --nologo
      - name: Migrate isolated localhost catalog
        shell: pwsh
        env:
          NOVAFLEET_MAINTENANCE_TEST_SQL: Server=localhost;Integrated Security=true;TrustServerCertificate=true;Database=NovaFleet_Maintenance_Test_20261116
        run: |
          ./scripts/Initialize-CiDatabase.ps1 -ConnectionString $env:NOVAFLEET_MAINTENANCE_TEST_SQL -ApiDll 'src/NovaFleet.Api/bin/Release/net10.0/NovaFleet.Api.dll'
      - name: Maintenance concurrency tests
        shell: pwsh
        env:
          NOVAFLEET_MAINTENANCE_TEST_SQL: Server=localhost;Integrated Security=true;TrustServerCertificate=true;Database=NovaFleet_Maintenance_Test_20261116
        run: |
          dotnet test tests/NovaFleet.IntegrationTests/NovaFleet.IntegrationTests.csproj --configuration Release --no-build --no-restore --nologo --filter 'FullyQualifiedName~MaintenanceSqlServerTests' --logger 'trx;LogFileName=maintenance.trx' --results-directory TestResults/sql
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Assert-CiTestResults.ps1 -TrxPath TestResults/sql/maintenance.trx -MinimumTotal 5
