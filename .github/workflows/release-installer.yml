name: release-installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-setup-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a shallow detached tag checkout breaks the SDK's git/SourceLink
          # queries during NuGet restore (bare MSB4181); branch checkouts work.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: NuGet diagnostics
        shell: pwsh
        run: |
          dotnet --info
          dotnet nuget locals all --list
          Get-ChildItem Env: | Where-Object { $_.Name -match 'NUGET|DOTNET|MSBUILD|GITHUB_REF' } | Sort-Object Name | Format-Table -AutoSize
          Get-ChildItem -Path . -Recurse -Filter NuGet.config -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "=== $($_.FullName) ==="; Get-Content $_.FullName }

      - name: Build Setup.exe (frontend + tests + publish + bundle prereq download + ISCC)
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File installer\build.ps1
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}
          # The .NET terminal logger swallows NuGet restore errors, surfacing as bare
          # MSB4181 ("RestoreTask returned false but did not log an error"). Disable it
          # so any real failure is visible; skip cert-revocation network checks that can
          # abort restore silently on locked-down CI runners.
          DOTNET_CLI_USE_TERMINAL_LOGGER: false
          NUGET_CERT_REVOCATION_MODE: offline
          MSBUILDDISABLENODEREUSE: 1

      - name: Upload restore binlog on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: restore-binlog
          path: installer/restore.binlog
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaFleet-Setup
          path: installer/output/NovaFleet-Setup-*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/NovaFleet-Setup-*.exe
          body: |
            NovaFleet installer (Setup.exe). Runs IIS + firewall setup, then opens the in-app
            setup wizard for database/domain/SMS settings. Carries the .NET 10 Hosting Bundle
            inside the package and installs it silently when the target server lacks a
            supported ANCM (20.x or newer).
            Unsigned build — SmartScreen "unknown publisher" warning is expected.
