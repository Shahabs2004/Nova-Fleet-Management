name: release-installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Creating a GitHub Release needs write access to repository contents; the default
# GITHUB_TOKEN is read-only ("Resource not accessible by integration").
permissions:
  contents: write

jobs:
  build-setup-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Setup.exe (frontend + tests + publish + bundle prereq download + ISCC)
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File installer\build.ps1
        env:
          # Tag ref_name carries a leading 'v' (v1.0.0); build.ps1 trims it and
          # normalizes $env:VERSION so MSBuild does not inherit an invalid Version.
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaFleet-Setup
          path: installer/output/NovaFleet-Setup-*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/NovaFleet-Setup-*.exe
          body: |
            NovaFleet installer (Setup.exe). Runs IIS + firewall setup, then opens the in-app
            setup wizard for database/domain/SMS settings. Carries the .NET 10 Hosting Bundle
            inside the package and installs it silently when the target server lacks a
            supported ANCM (20.x or newer).
            Unsigned build — SmartScreen "unknown publisher" warning is expected.