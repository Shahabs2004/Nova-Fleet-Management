name: release-installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-setup-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Setup.exe (frontend + tests + publish + bundle prereq download + ISCC)
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File installer\build.ps1
        env:
          VERSION: ${{ github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaFleet-Setup
          path: installer/output/NovaFleet-Setup-*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/NovaFleet-Setup-*.exe
          body: |
            NovaFleet installer (Setup.exe). Runs IIS + firewall setup, then opens the in-app
            setup wizard for database/domain/SMS settings. Requires .NET 10 Hosting Bundle on
            the target server (the installer aborts with a link if it is missing).
            Unsigned build — SmartScreen "unknown publisher" warning is expected.
